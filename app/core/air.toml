# Air configuration for app/core
# Docs: https://github.com/air-verse/air

root = "."

tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/core ./cmd/main.go"
  bin = "./tmp/core"
  delay = 200
  include_ext = ["go", "mod", "sum", "proto"]
  exclude_dir = ["tmp", "vendor", ".git"]
  stop_on_error = true

[log]
  time = true

