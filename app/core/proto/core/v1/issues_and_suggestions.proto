syntax = "proto3";

package core.v1;

import "request/v1/base.proto";
import "api/v1/generators.proto";
import "api/v1/permissions.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "app/core/gen/core/v1;corev1";

service IssuesAndSuggestionsService {
  option (api.v1.permissionKey) = "IssuesAndSuggestions";

  rpc Autocomplete(request.v1.AutocompleteRequest) returns (request.v1.AutocompleteResponse);
  rpc Create(SaveIssuesAndSuggestionsRequest) returns (IssuesAndSuggestions) {}
  rpc Get(request.v1.GetRequest) returns (IssuesAndSuggestions) {}
  rpc List(request.v1.SelectRequest) returns (ListIssuesAndSuggestionsResponse) {}
  rpc Update(SaveIssuesAndSuggestionsRequest) returns (IssuesAndSuggestions) {}
  rpc SoftDelete(request.v1.DeleteRequest) returns (request.v1.DeleteResponse);
  rpc Delete(request.v1.DeleteRequest) returns (request.v1.DeleteResponse);
}

message IssuesAndSuggestionsComment {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string userId = 2 [(buf.validate.field).string.min_len = 1];
  string userLabel = 3;
  string text = 4 [(buf.validate.field).string = {min_len: 1, max_len: 5000}];
  int64 createdAt = 5;
}

enum IssuesAndSuggestionsStatus {
  ISSUES_AND_SUGGESTIONS_STATUS_UNSPECIFIED = 0;
  OPEN = 1 [(api.v1.ts_enum_desc) = "Open"];
  IN_PROGRESS = 2 [(api.v1.ts_enum_desc) = "In Progress"];
  RESOLVED = 3 [(api.v1.ts_enum_desc) = "Resolved"];
  CLOSED = 4 [(api.v1.ts_enum_desc) = "Closed"];
  REJECTED = 5 [(api.v1.ts_enum_desc) = "Rejected"];
}

message IssuesAndSuggestions {
  option (api.v1.ts_grid) = true;

  string id = 1[(api.v1.ts_grid_opts) = {
    column: {
      visible: false,
    }
  }];
  string title = 2[(buf.validate.field).string = {min_len: 1, max_len: 500}, (api.v1.ts_grid_opts) = {
    filter: {
      quick: true,
    }
  }];
  optional string description = 3[(api.v1.ts_grid_opts) = {
    column: {
      visible: false,
    }
  }];
  IssuesAndSuggestionsStatus status = 4[(api.v1.ts_grid_opts) = {
    column: {
      header: "Status",
      visible: true,
      columnRendererType: "enum"
    },
    filter: {
      quick: true,
    }
  }];
  repeated IssuesAndSuggestionsComment comments = 5[(api.v1.ts_grid_opts) = {
    column: {
      visible: false,
    }
  }];

  int64 createdAt = 100;
  string createdBy = 101;
  optional string createdByLabel = 102;
  optional int64 updatedAt = 103;
  optional string updatedBy = 104;
  optional string updatedByLabel = 105;
  optional int64 deletedAt = 106;
  optional string deletedBy = 107;
  optional string deletedByLabel = 108;
}

message SaveIssuesAndSuggestionsRequest {
  string id = 1;
  string title = 2;
  optional string description = 3;
  IssuesAndSuggestionsStatus status = 4;
  repeated IssuesAndSuggestionsComment comments = 5;
}

message ListIssuesAndSuggestionsResponse {
  repeated IssuesAndSuggestions items = 1;
  request.v1.PaginationResponse pagination = 2;
}
