syntax = "proto3";

package core.v1;

import "api/v1/permissions.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "app/core/gen/core/v1;corev1";

service SystemSettingsService {
  option (api.v1.permissionKey) = "SystemSettings";

  // Get the current (latest version) system settings
  rpc Get(google.protobuf.Empty) returns (SystemSettings) {}

  // Update system settings (creates a new version)
  rpc Update(SaveSystemSettingsRequest) returns (SystemSettings) {}

  // Get version history of system settings
  rpc GetHistory(GetSystemSettingsHistoryRequest) returns (GetSystemSettingsHistoryResponse) {}
}

message SystemSettings {
  string id = 1;
  int32 version = 2;
  string systemTimezone = 3;
  int32 sessionDefaultDurationMinutes = 4;

  int64 createdAt = 100;
  string createdBy = 101;
  optional string createdByLabel = 102;
  optional int64 updatedAt = 103;
  optional string updatedBy = 104;
  optional string updatedByLabel = 105;
}

message SaveSystemSettingsRequest {
  string systemTimezone = 1 [(buf.validate.field).string.min_len = 1];
  int32 sessionDefaultDurationMinutes = 2 [(buf.validate.field).int32.gt = 0];
}

message GetSystemSettingsHistoryRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetSystemSettingsHistoryResponse {
  repeated SystemSettings items = 1;
  int32 total = 2;
}
