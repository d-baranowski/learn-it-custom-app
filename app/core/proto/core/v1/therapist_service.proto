syntax = "proto3";

package core.v1;

import "request/v1/base.proto";
import "api/v1/generators.proto";
import "api/v1/permissions.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "app/core/gen/core/v1;corev1";

service TherapistServiceLinkService {
  option (api.v1.permissionKey) = "TherapistService";

  rpc Autocomplete(request.v1.AutocompleteRequest) returns (request.v1.AutocompleteResponse);
  rpc Create(SaveTherapistServiceLinkRequest) returns (TherapistServiceLink) {}
  rpc Get(request.v1.GetRequest) returns (TherapistServiceLink) {}
  rpc List(request.v1.SelectRequest) returns (ListTherapistServiceLinkResponse) {}
  rpc Update(SaveTherapistServiceLinkRequest) returns (TherapistServiceLink) {}
  rpc SoftDelete(request.v1.DeleteRequest) returns (request.v1.DeleteResponse);
  rpc Delete(request.v1.DeleteRequest) returns (request.v1.DeleteResponse);
}

message TherapistServiceLink {
  option (api.v1.ts_grid) = true;

  string id = 1 [(api.v1.ts_grid_opts) = {
    column: {
      visible: false,
    }
  }];
  string therapistId = 2 [(api.v1.ts_grid_opts) = {
    column: {exclude: true}
    filter: {form: true, quick: true, formLabel: "Therapist", quickLabel: "Therapist"}
  }];
  string therapistLabel = 3 [(api.v1.ts_grid_opts) = {
    filter: {form: false, quick: false}
  }];
  string serviceId = 4 [(api.v1.ts_grid_opts) = {
    column: {exclude: true}
    filter: {form: true, quick: true, formLabel: "Service", quickLabel: "Service"}
  }];
  string serviceLabel = 5 [(api.v1.ts_grid_opts) = {
    filter: {form: false, quick: false}
  }];
  optional float price = 6;

  int64 createdAt = 100;
  string createdBy = 101;
  optional string createdByLabel = 102;
  optional int64 updatedAt = 103;
  optional string updatedBy = 104;
  optional string updatedByLabel = 105;
  optional int64 deletedAt = 106;
  optional string deletedBy = 107;
  optional string deletedByLabel = 108;
}

message SaveTherapistServiceLinkRequest {
  string id = 1;
  string therapistId = 2;
  string serviceId = 3;
  optional float price = 4;
}

message ListTherapistServiceLinkResponse {
  repeated TherapistServiceLink items = 1;
  request.v1.PaginationResponse pagination = 2;
}
