syntax = "proto3";

package core.v1;

import "request/v1/base.proto";
import "api/v1/generators.proto";
import "api/v1/permissions.proto";
import "buf/validate/validate.proto";

option go_package = "app/core/gen/core/v1;corev1";

service RoleService {
  option (api.v1.permissionKey) = "Role";

  rpc Autocomplete(request.v1.AutocompleteRequest) returns (request.v1.AutocompleteResponse);
  rpc Get(request.v1.GetRequest) returns (Role);
  rpc List(request.v1.SelectRequest) returns (ListRoleResponse);
  rpc Create(SaveRoleRequest) returns (Role);
  rpc Update(SaveRoleRequest) returns (Role);
  //  rpc SoftDelete(api.v1.DeleteRequest) returns (api.v1.DeleteResponse);
  rpc Delete(request.v1.DeleteRequest) returns (request.v1.DeleteResponse);
}

message Role {
  option (api.v1.ts_grid) = true;

  string id = 1;
  string name = 2;
  string description = 3;

  int64 createdAt = 100;
  string createdBy = 101;
  string createdByLabel = 102;
  optional int64 updatedAt = 103;
  optional string updatedBy = 104;
  optional string updatedByLabel = 105;
  optional int64 deletedAt = 106;
  optional string deletedBy = 107;
  optional string deletedByLabel = 108;
}

message ListRoleResponse {
  repeated Role items = 1;
  request.v1.PaginationResponse pagination = 2;
}

message SaveRoleRequest {
  string id = 1;
  string name = 2 [
    (buf.validate.field) = {required: true},
    (buf.validate.field).cel = {
      id: "SaveRoleRequest.name",
      message: "Name must be set",
      expression: "this != ''"
    }
  ];
  string description = 3 [
    (buf.validate.field) = {required: true},
    (buf.validate.field).cel = {
      id: "SaveRoleRequest.description",
      message: "Description must be set",
      expression: "this != ''"
    }
  ];
}
