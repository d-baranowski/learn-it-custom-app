syntax = "proto3";

package api.v1;

import "request/v1/base.proto";
import "api/v1/permissions.proto";
import "api/v1/generators.proto";

option go_package = "pkg/ui-test-fixtures/gen/ui-test-fixtures/v1;uitestfixturesv1";

// Do not alter these types, they are used for testing purposes

